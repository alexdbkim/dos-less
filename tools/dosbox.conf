; =============================================================================
; dosbox.conf -- pinned DOSBox-X config for reproducible builds and tests.
;
; This file is read by tools/build.sh and tools/test.sh via -conf.
; Only options that matter for our use are set; the rest fall to defaults.
; =============================================================================

[sdl]
output         = surface
fullscreen     = false
autolock       = false

[render]
aspect         = false
scaler         = none

[cpu]
core           = auto
cputype        = 286
cycles         = max

[dosbox]
machine        = vgaonly
memsize        = 16

[dos]
ver            = 6.22

[autoexec]
@echo off
; (mounts and commands are passed via -c at invocation time)
